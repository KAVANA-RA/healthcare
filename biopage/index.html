<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care - Personal Details</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="app-wrapper">

    <main class="card-container" role="main">

      <!-- Header with Title on Left and Logo on Top-Right -->
      <header class="card-header">

        <div class="header-text">
          <h1 class="form-title">Personal Details</h1>
          <p class="form-subtitle">Please enter your medical & personal records</p>
        </div>

        <div class="logo-wrapper" title="Care Healthcare Logo">
          <img src="assets/logo.png" alt="Healthcare Logo" class="brand-logo" id="brandLogo">
        </div>

      </header>


      <!-- Main Form Section -->
      <form id="personalDetailsForm" class="form-body" novalidate>

        <!-- DOB (Date of Birth) Field -->
        <div class="form-group">

          <label for="dob" class="form-label">
            DOB <span class="required-star">*</span>
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>

              </svg>
            </span>

            <input
              type="date"
              id="dob"
              name="dob"
              class="form-control has-icon"
              required
            >

          </div>

          <span class="field-feedback" id="dobError"></span>

        </div>


        <!-- Hospital Field -->
        <div class="form-group">

          <label for="hospital" class="form-label">
            Hospital <span class="required-star">*</span>
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <path d="M3 21h18"></path>
                <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
                <path d="M9 10h6"></path>
                <path d="M12 7v6"></path>

              </svg>
            </span>

            <input
              type="text"
              id="hospital"
              name="hospital"
              class="form-control has-icon"
              placeholder="e.g. Apollo Hospital, City Clinic"
              list="hospitalSuggestions"
              required
            >

            <datalist id="hospitalSuggestions">
              <option value="Apollo Hospitals"></option>
              <option value="Fortis Healthcare"></option>
              <option value="Manipal Hospital"></option>
              <option value="Max Super Speciality Hospital"></option>
              <option value="AIIMS"></option>
              <option value="City Care General Hospital"></option>
            </datalist>

          </div>

          <span class="field-feedback" id="hospitalError"></span>

        </div>


        <!-- num: (Contact / Patient Number) Field -->
        <div class="form-group">

          <label for="num" class="form-label">
            num <span class="required-star">*</span>
          </label>

          <div class="phone-input-group">

            <div class="country-prefix">
              <span class="flag-icon">🇮🇳</span>
              <span class="code">+91</span>
            </div>

            <div class="input-wrapper flex-1">

              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1
                  4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81
                  2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27
                  a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1
                  22 16.92z"></path>

                </svg>
              </span>

              <input
                type="tel"
                id="num"
                name="num"
                class="form-control has-icon"
                placeholder="Enter 10-digit number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
              >

            </div>

          </div>

          <span class="field-feedback" id="numError"></span>

        </div>


        <!-- Bio (optional) Field -->
        <div class="form-group">

          <div class="label-row">

            <label for="bio" class="form-label">
              Bio <span class="optional-tag">(optional)</span>
            </label>

            <span class="char-counter" id="bioCounter">0/200</span>

          </div>

          <textarea
            id="bio"
            name="bio"
            rows="3"
            class="form-control textarea-control"
            placeholder="Any allergies, preexisting conditions, or personal notes..."
            maxlength="200"
          ></textarea>

        </div>


        <!-- Next Button -->
        <div class="form-actions">

          <button type="submit" class="btn-next" id="nextBtn">

            <span>Next</span>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="btn-arrow">

              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>

            </svg>

          </button>

        </div>

      </form>


      <!-- Confirmation / Next Step View -->
      <section
        class="confirmation-panel"
        id="confirmationPanel"
        style="display: none;"
        aria-live="polite"
      >

        <div class="success-header">

          <div class="check-animation-circle">

            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

              <polyline points="20 6 9 17 4 12"></polyline>

            </svg>

          </div>

          <h2>Details Recorded!</h2>

          <p>Here is a summary of your personal details:</p>

        </div>


        <div class="summary-card">

          <div class="summary-row">
            <span class="summary-label">DOB:</span>
            <span class="summary-value" id="summaryDob">-</span>
          </div>

          <div class="summary-row">
            <span class="summary-label">Hospital:</span>
            <span class="summary-value" id="summaryHospital">-</span>
          </div>

          <div class="summary-row">
            <span class="summary-label">num:</span>
            <span class="summary-value" id="summaryNum">-</span>
          </div>

          <div class="summary-row">
            <span class="summary-label">Bio:</span>
            <span class="summary-value" id="summaryBio">None provided</span>
          </div>

        </div>


        <div class="confirmation-actions">

          <button type="button" class="btn-secondary" id="editBtn">

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>

            </svg>

            <span>Back to Edit</span>

          </button>


          <button type="button" class="btn-primary" id="confirmProceedBtn">

            <span>Proceed to Step 2</span>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>

            </svg>

          </button>

        </div>

      </section>


      <!-- Footer Branding -->
      <footer class="card-footer">

        <p>🔒 256-bit Secure Medical Encryption &bull; Care Network</p>

      </footer>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>
